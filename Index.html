<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>360 VR Viewer</title>
    <meta name="description" content="360-degree VR Viewer">
    <!-- Load the A-Frame WebVR library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Replace 'your-360-image.jpg' with the exact name of your uploaded image -->
      <a-sky src="your-360-image.jpg" rotation="0 -130 0"></a-sky>
      
      <!-- Optional: Add a camera with cursor for interactivity -->
      <a-camera position="0 1.6 0">
        <a-cursor color="yellow"></a-cursor>
      </a-camera>
    </a-scene>
  </body>
</html>
